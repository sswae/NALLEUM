<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NALLEUM</title>
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
    <link rel="icon" href="favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* ── Move Popup ── */
        .move-popup {
            position: absolute;
            z-index: 2000;
            background: #9bbc0f;
            border: 1px solid #0f380f;
            border-bottom-width: 3px;
            display: flex;
            flex-direction: column;
            min-width: 70px;
        }
        .move-popup-option {
            padding: 6px 10px;
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            color: #0f380f;
            cursor: pointer;
        }
        .move-popup-option:hover { background: #8bac0f; }
        .move-popup-option + .move-popup-option { border-top: 1px solid rgba(0,0,0,0.15); }

        /* ── Reset & Base ── */
        * { box-sizing: border-box; text-shadow: none !important; box-shadow: none !important; }

        body {
            background-color: #8bac0f;
            font-family: 'Press Start 2P', cursive;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        #app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* ── Scroll to Top ── */
        #topBtn {
            position: fixed;
            right: 14px;
            bottom: 14px;
            z-index: 900;
            width: auto;
            height: 26px;
            padding: 0 8px;
            border-radius: 0;
            background-color: #306230;
            color: #9bbc0f;
            border: 2px solid #0f380f;
            border-bottom-width: 4px;
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.08s ease, border-bottom-width 0.08s ease, opacity 0.15s;
        }
        #topBtn.visible { display: flex; }
        #topBtn:hover { opacity: 1; }
        #topBtn:active { transform: translateY(2px); border-bottom-width: 2px; }

        /* ── Loading Screen ── */
        #loading-screen {
            position: fixed;
            inset: 0;
            background-color: #306230;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            cursor: pointer;
        }

        /* ── Header ── */
        header { text-align: center; margin-bottom: 30px; }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        h1 {
            font-size: 28px;
            color: #0f380f;
            letter-spacing: 2px;
            margin-top: 50px;
            margin-bottom: 60px;
        }

        /* ── Navigation Tabs ── */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            margin-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: 2px solid #0f380f;
            border-radius: 0;
            padding: 8px 15px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            color: #0f380f;
            transition: transform 0.08s ease, background-color 0.1s;
        }

        .tab-btn.active {
            background-color: #306230;
            color: #9bbc0f;
        }

        /* ── Pixel Buttons (shared press effect) ── */
        .btn-pixel {
            background-color: #306230;
            color: #9bbc0f;
            border: 2px solid #0f380f;
            border-bottom-width: 4px;
            padding: 8px 15px;
            border-radius: 0;
            font-size: 10px;
            cursor: pointer;
            font-family: 'Press Start 2P';
            transition: transform 0.08s ease, border-bottom-width 0.08s ease;
        }

        /* ── Arcade Press Effect ── */
        .btn-pixel:active,
        .tab-btn:active {
            transform: translateY(2px);
        }

        .btn-pixel:active {
            border-bottom-width: 2px;
        }

        /* ── Editor Box ── */
        .editor-box {
            background-color: #9bbc0f;
            border: 1px solid #0f380f;
            padding: 15px;
            margin-bottom: 20px;
            transition: border-color 0.15s, background-color 0.15s;
        }

        .editor-box.drag-over {
            background-color: #8bac0f;
        }

        .post-input {
            width: 100%;
            background: transparent;
            border: none;
            resize: vertical;
            font-family: sans-serif;
            font-size: 14px;
            outline: none;
            min-height: 100px;
            color: #0f380f;
        }

        .editor-controls {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        /* ── Image Preview ── */
        .preview-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .preview-item {
            position: relative;
            width: 50px;
            height: 50px;
            border: 1px solid #0f380f;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1) sepia(1) hue-rotate(30deg) brightness(0.7) contrast(1.2);
        }

        .preview-remove {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #8bac0f;
            color: #0f380f;
            border-radius: 0;
            width: 18px;
            height: 18px;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            font-family: sans-serif;
        }

        /* ── Post List ── */
        .post-item {
            border-bottom: 1px solid #0f380f;
            padding: 15px 0;
            color: #0f380f;
            display: flex;
            flex-direction: column;
        }

        .post-item > div:nth-child(2) { white-space: pre-wrap; word-break: break-all; }

        .post-actions {
            align-self: flex-end;
            display: flex;
            gap: 8px;
            font-size: 7px;
            color: #0f380f;
            cursor: pointer;
            margin-bottom: 5px;
        }

        /* ── Diary Cards ── */
        .diary-card {
            background-color: #306230;
            border: 2px solid #0f380f;
            margin-bottom: 25px;
            padding: 15px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.08s ease, border-bottom-width 0.08s ease;
            border-bottom-width: 5px;
        }

        .diary-card:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        .diary-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            border: 1px solid #0f380f;
            background-color: #306230;
            margin-bottom: 12px;
            display: block;
            filter: grayscale(1) sepia(1) hue-rotate(30deg) brightness(0.7) contrast(1.2);
        }

        .diary-card-title {
            color: #9bbc0f;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 2px;
        }

        .diary-card-date {
            color: #9bbc0f;
            font-size: 8px;
            font-family: 'Press Start 2P';
            opacity: 0.8;
            letter-spacing: -0.5px;
        }

        .gb-buttons {
            position: absolute;
            right: 15px;
            bottom: 15px;
            display: flex;
            gap: 8px;
            transform: rotate(-30deg);
        }

        .gb-btn {
            width: 22px;
            height: 22px;
            background-color: #0f380f;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P';
            font-size: 10px;
            color: #8bac0f;
        }

        /* ── Diary Detail View ── */
        #diary-detail-view {
            display: none;
            color: #0f380f;
            min-height: 500px;
            padding-bottom: 50px;
        }

        .detail-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #0f380f;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        .detail-title {
            font-size: 20px;
            font-family: sans-serif;
            font-weight: bold;
            margin-bottom: 5px;
            color: #0f380f;
        }

        .detail-date {
            font-family: 'Press Start 2P';
            font-size: 10px;
            color: #306230;
        }

        .detail-actions {
            display: flex;
            gap: 10px;
            font-size: 8px;
            font-family: 'Press Start 2P';
            color: #0f380f;
            cursor: pointer;
        }

        .detail-images img {
            width: 100%;
            margin-bottom: 15px;
            border: 1px solid #0f380f;
            cursor: zoom-in;
            filter: grayscale(1) sepia(1) hue-rotate(30deg) brightness(0.7) contrast(1.2);
        }

        .detail-content {
            font-family: sans-serif;
            font-size: 15px;
            line-height: 1.7;
            color: #0f380f;
            margin-bottom: 30px;
        }

        /* ── Diary Full Editor ── */
        #diary-full-editor {
            display: none;
            background-color: #9bbc0f;
            border: 1px solid #0f380f;
            padding: 20px;
        }

        #diaryTitleInput {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid #0f380f;
            font-family: sans-serif;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 0;
            outline: none;
            margin-bottom: 15px;
        }

        #diaryContentInput {
            width: 100%;
            background: transparent;
            border: none;
            resize: none;
            font-family: sans-serif;
            font-size: 14px;
            outline: none;
            min-height: 250px;
            line-height: 1.6;
        }

        /* ── Image Modal ── */
        #imgModal {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            cursor: default;
        }

        #modalImgWrap {
            width: 88vw;
            height: 88vh;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #modalImgWrap.zoomed {
            align-items: flex-start;
            justify-content: flex-start;
            cursor: grab;
        }
        #modalImgWrap.zoomed:active { cursor: grabbing; }

        #modalImg {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            user-select: none;
            display: block;
        }
        #modalImgWrap.zoomed #modalImg {
            max-width: none;
            max-height: none;
        }

        #modalClose {
            position: absolute;
            top: 16px; right: 20px;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            opacity: 0.7;
            line-height: 1;
        }
        #modalClose:hover { opacity: 1; }

        #modalPrev, #modalNext {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            opacity: 0.6;
            padding: 10px 16px;
            user-select: none;
            transition: opacity 0.15s;
        }
        #modalPrev:hover, #modalNext:hover { opacity: 1; }
        #modalPrev { left: 10px; }
        #modalNext { right: 10px; }
        #modalPrev.hidden, #modalNext.hidden { visibility: hidden; }

        #modalCounter {
            position: absolute;
            bottom: 18px;
            left: 50%; transform: translateX(-50%);
            font-family: 'Press Start 2P';
            font-size: 9px;
            color: rgba(255,255,255,0.6);
            letter-spacing: 1px;
        }

        #modalZoomControls {
            position: absolute;
            bottom: 14px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Press Start 2P';
            color: rgba(255,255,255,0.7);
        }
        #modalZoomControls .zoom-btn {
            cursor: pointer;
            padding: 4px 10px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 4px;
            font-size: 12px;
            user-select: none;
            transition: background 0.15s, opacity 0.15s;
        }
        #modalZoomControls .zoom-btn:hover { background: rgba(255,255,255,0.12); }
        #modalZoomLabel {
            font-size: 9px;
            min-width: 38px;
            text-align: center;
        }

        /* ── Misc ── */

        .backup-text {
            font-size: 10px;
            color: #0f380f;
            cursor: pointer;
            transition: color 0.3s;
        }

        .backup-text:hover { color: #ffffff; }

        /* ── Pagination ── */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            padding-bottom: 20px;
            flex-wrap: wrap;
        }

        .page-btn {
            cursor: pointer;
            color: #0f380f;
            font-family: 'Press Start 2P';
            font-size: 10px;
            transition: transform 0.08s ease;
            padding: 2px 3px;
        }

        .page-btn:active { transform: scale(0.9); }
        .page-btn.active { color: #306230; text-decoration: underline; }

        .page-ellipsis {
            color: #306230;
            opacity: 0.5;
            font-family: 'Press Start 2P';
            font-size: 10px;
        }

        .page-nav {
            cursor: pointer;
            color: #0f380f;
            font-family: 'Press Start 2P';
            font-size: 9px;
            opacity: 0.75;
            transition: opacity 0.15s, transform 0.08s ease;
            padding: 2px 4px;
        }
        .page-nav:hover { opacity: 1; }
        .page-nav:active { transform: scale(0.9); }
        .page-nav.disabled { opacity: 0.2; pointer-events: none; }

        /* ── Global Search Bar ── */
        .global-search-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 10px;
            margin-bottom: 14px;
        }

        .search-icon { font-size: 11px; opacity: 0.4; color: #0f380f; flex-shrink: 0; }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(61, 43, 31, 0.3);
            padding: 4px 2px;
            font-family: 'Press Start 2P';
            font-size: 8px;
            color: #0f380f;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus { border-bottom-color: rgba(61, 43, 31, 0.65); }
        .search-input::placeholder { color: #0f380f; opacity: 0.3; }

        .search-clear {
            font-size: 10px;
            color: #0f380f;
            opacity: 0;
            cursor: pointer;
            transition: opacity 0.15s;
            flex-shrink: 0;
        }

        .search-clear.visible { opacity: 0.35; }
        .search-clear.visible:hover { opacity: 0.7; }

        .search-count {
            font-family: 'Press Start 2P';
            font-size: 8px;
            color: #306230;
            text-align: right;
            margin-bottom: 10px;
            min-height: 14px;
        }

        mark.hl {
            background: #8bac0f;
            color: #0f380f;
            border-radius: 0;
            padding: 0 1px;
        }

        .filter-bar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .img-filter-btn {
            background: none;
            border: 1px solid #0f380f;
            border-radius: 0;
            padding: 3px 8px;
            font-family: 'Press Start 2P';
            font-size: 7px;
            color: #0f380f;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.15s, background-color 0.1s, transform 0.08s ease;
        }
        .img-filter-btn:hover { opacity: 0.9; }
        .img-filter-btn:active { transform: scale(0.94); }
        .img-filter-btn.active {
            background-color: #0f380f;
            color: #9bbc0f;
            opacity: 1;
        }

        /* ── Multi-select move ── */
        .post-select-checkbox {
            width: 14px;
            height: 14px;
            margin-right: 6px;
            accent-color: #306230;
            cursor: pointer;
            flex-shrink: 0;
        }

        .post-item.selected {
            background-color: rgba(138, 74, 74, 0.12);
        }

        .bulk-move-bar {
            position: fixed;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            z-index: 950;
            width: calc(100% - 28px);
            max-width: 452px;
            background-color: #0f380f;
            color: #9bbc0f;
            border: 2px solid #0f380f;
            border-bottom-width: 4px;
            border-radius: 0;
            padding: 10px 12px;
            align-items: center;
            justify-content: space-between;
            font-family: 'Press Start 2P', cursive;
            font-size: 9px;
            gap: 10px;
        }

        .bulk-move-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .bulk-move-btn {
            padding: 6px 10px;
            font-size: 8px;
            border-bottom-width: 3px;
        }

        /* ── Hashtags ── */
        .hashtag {
            color: #306230;
            font-weight: bold;
            cursor: pointer;
        }
        .hashtag:hover { text-decoration: underline; }

        .hashtag-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #8bac0f;
            color: #0f380f;
            border-radius: 0;
            padding: 3px 8px;
            font-family: 'Press Start 2P';
            font-size: 7px;
        }
        .hashtag-badge-clear {
            cursor: pointer;
            opacity: 0.8;
        }
        .hashtag-badge-clear:hover { opacity: 1; }

        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0;
        }
        .tag-cloud:empty { margin: 0; }
        .tag-cloud-item {
            background: none;
            border: 1px solid #0f380f;
            border-radius: 0;
            padding: 3px 9px;
            font-family: 'Press Start 2P';
            font-size: 8px;
            color: #0f380f;
            cursor: pointer;
            opacity: 0.75;
            transition: opacity 0.15s, background-color 0.1s, transform 0.08s ease;
        }
        .tag-cloud-item:hover { opacity: 1; }
        .tag-cloud-item:active { transform: scale(0.94); }
        .tag-cloud-item.active {
            background-color: #8bac0f;
            border-color: #8bac0f;
            color: #0f380f;
            opacity: 1;
        }

        /* ── Arcade Loading / Error Text ── */
        .bounce-letter {
            display: inline-block;
            animation: letterBounce 1s ease-in-out infinite;
        }
        @keyframes letterBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        .fail-flicker {
            display: inline-block;
            animation: failFlicker 1s steps(2, start) infinite;
        }
        @keyframes failFlicker {
            0%, 100% { opacity: 1; color: #0f380f; }
            50%      { opacity: 0.35; color: #306230; }
        }

        .retry-link {
            display: inline-block;
            text-decoration: underline;
            cursor: pointer;
            color: #306230;
        }

        /* ── Animations ── */
        @keyframes blink-color {
            0%, 100% { color: #9bbc0f; }
            50% { color: #8bac0f; }
        }

        .blinking-text {
            font-family: 'Press Start 2P';
            font-size: 16px;
            animation: blink-color 1s infinite;
        }

        /* ── Coin insert flash on load ── */
        @keyframes coin-flash {
            0%   { opacity: 0; transform: scale(0.85); }
            15%  { opacity: 1; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        #app { animation: coin-flash 0.4s ease-out both; }
    </style>
</head>
<body>

<!-- Loading Screen -->
<div id="loading-screen" onclick="enterApp()">
    <div class="blinking-text">PRESS START</div>
</div>

<div id="app">
    <header>
        <div class="global-search-bar">
            <span class="search-icon">🔍</span>
            <input class="search-input" id="global-search" placeholder="SEARCH..." oninput="onSearch()" autocomplete="off">
            <span class="search-clear" id="search-clear-btn" onclick="clearSearch()">✕</span>
        </div>
        <div class="header-row">
            <span class="backup-text" onclick="backupToMarkdown()">🔄 REPORT</span>
        </div>

        <h1>NALLEUM</h1>

        <div class="nav-tabs">
            <button id="tabBubble" class="tab-btn active" onclick="switchTab('BUBBLE')">BUBBLE</button>
            <button id="tabNin"    class="tab-btn"        onclick="switchTab('NIN')">NIN</button>
            <button id="tabNeg"    class="tab-btn"        onclick="switchTab('NEG')">NEG</button>
            <button id="tabDiary"  class="tab-btn"        onclick="switchTab('DIARY')">DIARY</button>
        </div>
    </header>

    <!-- BUBBLE Tab -->
    <div id="bubble-container">
        <div class="editor-box" id="bubble-editor-box">
            <textarea id="bubble-text" class="post-input" placeholder="무슨 일이 일어나고 있나요"></textarea>
            <!-- 해시태그선택 -->
            <div id="bubble-insert-tags" class="tag-cloud" style="margin-top: 10px; padding-top: 10px;"></div>
            <div id="bubble-previews" class="preview-container"></div>
            <div class="editor-controls">
                <input type="file" id="bubbleFile" multiple accept="image/*" onchange="handleImg(this, 'BUBBLE')" style="display:none">
                <button class="btn-pixel" onclick="document.getElementById('bubbleFile').click()">IMG</button>
                <button id="bubbleSendBtn" class="btn-pixel" onclick="savePost('BUBBLE')">SEND</button>
            </div>
        </div>
        <div class="tag-cloud" id="bubble-tag-cloud"></div>
        <div class="filter-bar">
            <span class="img-filter-btn" id="bubble-img-filter" onclick="toggleImgFilter('BUBBLE')">💚 IMG ONLY</span>
            <span class="img-filter-btn" id="bubble-select-toggle" onclick="toggleSelectMode('BUBBLE')">✅ SELECT</span>
            <span id="bubble-hashtag-badge"></span>
        </div>
        <div class="search-count" id="bubble-search-count"></div>
        <div id="bubble-list"></div>
        <div id="bubble-pagination" class="pagination"></div>
    </div>

    <!-- NIN Tab -->
    <div id="nin-container" style="display:none">

<!-- Firebase Module -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
        initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
        collection, addDoc, onSnapshot, query, orderBy,
        doc, deleteDoc, updateDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import {
        getStorage, ref, uploadBytes, getDownloadURL, deleteObject
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBHMSPEsozQp2ZcanrRWy0-ZE7aoxviDgE",
        authDomain: "nalleum.firebaseapp.com",
        projectId: "nalleum",
        storageBucket: "nalleum.firebasestorage.app",
        messagingSenderId: "889977175883",
        appId: "1:889977175883:web:553b25bd73cb0d758332ce"
    };

    const app = initializeApp(firebaseConfig);

    // Multi-tab IndexedDB persistence: reads/writes are served from a local
    // cache first (works offline, and a repeat visit never has to wait on
    // the network before showing something), and several tabs/windows on
    // the same device share one cache instead of fighting over it.
    const db = initializeFirestore(app, {
        localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
    });
    const storage = getStorage(app);

    window.db      = db;
    window.storage = storage;
    window.fbActions = {
        ref, uploadBytes, getDownloadURL, deleteObject,
        addDoc, collection, onSnapshot, query, orderBy,
        doc, deleteDoc, updateDoc
    };

    // ═══════════════════════════════════════════════════════════════
    // ── DATA LAYER — onSnapshot + offline persistence ──
    //
    // Previous approach: read the whole collection once per app entry,
    // queue every write in localStorage, and flush the queue by hand on a
    // timer. That fixed the "too many reads" problem, but it also meant
    // only one device could safely hold the "current" copy of the data —
    // and a first-ever load with no cache and no network just showed a
    // blank/failed screen.
    //
    // New approach: one onSnapshot listener per board, backed by
    // persistentLocalCache (IndexedDB). This gives us, for free, exactly
    // the properties we were hand-rolling before:
    //   - Reads are billed once for the initial listen, then only for
    //     documents that actually changed — paging/searching/filtering
    //     still never touches the network, since that's all done locally
    //     over window.boardData.
    //   - Writes made offline are queued and retried by the SDK itself
    //     (no more hand-rolled retry loop that could hammer Firestore).
    //   - Local writes (even offline ones) are reflected back through the
    //     same onSnapshot callback almost instantly, so the UI still feels
    //     instant — we don't need a separate optimistic-update path.
    //   - Changes made on another device show up here automatically
    //     whenever this device is online, which is the multi-device
    //     support we didn't have before.
    //   - On a repeat visit, the listener serves the last-synced local
    //     copy immediately (no blank screen), then quietly reconciles with
    //     the server. Only a device's very first-ever load (empty cache +
    //     no network) can still show nothing — that's the one case the
    //     retry screen below is for.
    // ═══════════════════════════════════════════════════════════════

    const BOARD_TYPES         = ['BUBBLE', 'NIN', 'NEG', 'DIARY'];
    const POSTS_PER_PAGE      = 20;
    const FIRST_LOAD_TIMEOUT_MS = 8000; // only matters if this device has never synced before

    window.boardData           = { BUBBLE: [], NIN: [], NEG: [], DIARY: [] }; // in-memory source of truth, kept in sync by onSnapshot
    window.currentPage         = { BUBBLE: 1, NIN: 1, NEG: 1 };
    window.POSTS_PER_PAGE      = POSTS_PER_PAGE;

    const listEls   = { BUBBLE: 'bubble-list', NIN: 'nin-list', NEG: 'neg-list', DIARY: 'diary-list' };
    const everLoaded = { BUBBLE: false, NIN: false, NEG: false, DIARY: false }; // has this board received ANY snapshot yet (cache or server)?

    // ── Arcade text helpers ──
    function bouncyText(text) {
        return text.split('').map((ch, i) =>
            `<span class="bounce-letter" style="animation-delay:${(i * 0.07).toFixed(2)}s">${ch === ' ' ? '&nbsp;' : ch}</span>`
        ).join('');
    }

    function loadingHTML() {
        return `<div style="color:#0f380f; text-align:center; padding:20px; font-size:10px;">${bouncyText('LOADING...')}</div>`;
    }

    function failHTML(retryOnclick) {
        return `<div style="color:#0f380f; text-align:center; padding:20px; font-size:10px;">
            <span class="fail-flicker">${bouncyText('LOAD FAILED.')}</span><br><br>
            <span class="retry-link" onclick="${retryOnclick}">💣 RETRY</span>
        </div>`;
    }

    // ── Listener setup — one per board, kept alive for the whole session ──
    function attachBoardListener(type) {
        const q = query(collection(window.db, type), orderBy("createdAt", "desc"));
        onSnapshot(q, { includeMetadataChanges: true }, snap => {
            window.boardData[type] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            everLoaded[type] = true;

            console.log(`[nalleum] ${type}: ${window.boardData[type].length} posts (${snap.metadata.fromCache ? 'from cache' : 'from server'}${snap.metadata.hasPendingWrites ? ', pending writes' : ''})`);

            if (window.renderBoard) window.renderBoard(type);
        }, err => {
            console.error(`[nalleum] ${type}: listener error`, err);
            // Only show the failure screen if this device has never synced
            // this board before — otherwise keep showing whatever we've
            // already got, since that's still good data.
            if (!everLoaded[type]) {
                const el = document.getElementById(listEls[type]);
                if (el) el.innerHTML = failHTML(`window.retryLoad('${type}')`);
            }
        });
    }

    // A first-ever load with no cache and no network can sit "connecting"
    // forever (there's nothing wrong, it's just genuinely waiting) — so we
    // give it a timeout and offer a retry, instead of a silent blank list.
    function armFirstLoadTimeout(type) {
        setTimeout(() => {
            if (everLoaded[type]) return;
            const el = document.getElementById(listEls[type]);
            if (el) el.innerHTML = failHTML(`window.retryLoad('${type}')`);
        }, FIRST_LOAD_TIMEOUT_MS);
    }

    // The listener itself never stopped trying in the background, so
    // "retry" just means: show the loading state again and give it another
    // window to connect.
    function retryLoad(type) {
        if (everLoaded[type]) { window.renderBoard(type); return; }
        const el = document.getElementById(listEls[type]);
        if (el) el.innerHTML = loadingHTML();
        armFirstLoadTimeout(type);
    }

    async function waitForRenderBoard() {
        return new Promise(resolve => {
            if (window.renderBoard) return resolve();
            const iv = setInterval(() => {
                if (window.renderBoard) { clearInterval(iv); resolve(); }
            }, 20);
        });
    }

    async function init() {
        await waitForRenderBoard();

        BOARD_TYPES.forEach(t => {
            const el = document.getElementById(listEls[t]);
            if (el) el.innerHTML = loadingHTML();
            attachBoardListener(t);
            armFirstLoadTimeout(t);
        });
    }

    init();

    // ── Writes — straight to Firestore, no manual queue ──
    // persistentLocalCache already queues these when offline and resends
    // them itself once the connection returns; and because onSnapshot
    // reflects local writes immediately (see attachBoardListener above),
    // the UI updates just as fast as the old hand-rolled version did.
    async function queueCreate(type, data) {
        try {
            await window.fbActions.addDoc(window.fbActions.collection(window.db, type), data);
        } catch (e) {
            console.error(`[nalleum] create failed for ${type}`, e);
        }
    }

    async function queueUpdate(type, id, data) {
        try {
            await window.fbActions.updateDoc(window.fbActions.doc(window.db, type, id), data);
        } catch (e) {
            console.error(`[nalleum] update failed for ${type}/${id}`, e);
        }
    }

    async function queueDelete(type, id, images) {
        try {
            await window.fbActions.deleteDoc(window.fbActions.doc(window.db, type, id));
        } catch (e) {
            console.error(`[nalleum] delete failed for ${type}/${id}`, e);
            return;
        }
        for (const url of (images || [])) {
            try {
                const imgPath = decodeURIComponent(url.split('/o/')[1].split('?')[0]);
                await window.fbActions.deleteObject(window.fbActions.ref(window.storage, imgPath));
            } catch (e) {}
        }
    }

    window.retryLoad        = retryLoad;
    window.queueCreate      = queueCreate;
    window.queueUpdate      = queueUpdate;
    window.queueDelete      = queueDelete;

    // ── Pagination — now pure client-side slicing, zero reads per page turn ──
    function renderPagination(type, current, total) {
        const container = document.getElementById(type.toLowerCase() + '-pagination');
        if (!container) return;

        const WINDOW = 4; // pages shown on each side of current
        const show = new Set();
        show.add(1);
        show.add(total);
        for (let i = current - WINDOW; i <= current + WINDOW; i++) {
            if (i >= 1 && i <= total) show.add(i);
        }

        const sorted = [...show].sort((a, b) => a - b);
        const pages = [];
        sorted.forEach((p, idx) => {
            if (idx > 0 && p - sorted[idx - 1] > 1) pages.push('…');
            pages.push(p);
        });

        const prevDisabled = current <= 1 ? 'disabled' : '';
        const nextDisabled = current >= total ? 'disabled' : '';

        const numberHtml = pages.map(p =>
            p === '…'
                ? `<span class="page-ellipsis">···</span>`
                : `<span class="page-btn ${p === current ? 'active' : ''}" onclick="window.loadPosts('${type}', ${p})">${p}</span>`
        ).join('');

        container.innerHTML = `
            <span class="page-nav ${prevDisabled}" onclick="window.loadPosts('${type}', ${current - 1})">&#10094; PREV</span>
            ${numberHtml}
            <span class="page-nav ${nextDisabled}" onclick="window.loadPosts('${type}', ${current + 1})">NEXT &#10095;</span>
        `;
    }

    // Page switch is now instant (no fetch) — just re-render the right slice.
    function loadPosts(type, page = 1, opts = {}) {
        const scroll = opts.scroll !== false;
        window.currentPage[type] = Math.max(1, page);
        window.renderBoard(type);
        if (scroll) window.scrollTo(0, 0);
    }

    function loadDiary() {
        window.renderBoard('DIARY');
    }

    window.loadPosts        = loadPosts;
    window.loadDiary        = loadDiary;
    window.renderPagination = renderPagination;
</script>

<!-- App Logic -->
<script>
    // ── State ──
    let tempImages = [];
    let tempBlobs  = [];
    let editDiaryId = null;
    let editPostId  = null;
    const DEFAULT_IMAGES = ["default1.png", "default2.png"];

    // ── Scroll to Top ──
    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    (function setupTopBtn() {
        const btn = document.getElementById('topBtn');
        window.addEventListener('scroll', () => {
            btn.classList.toggle('visible', window.scrollY > 300);
        });
    })();

    // ── Loading screen ──
    function enterApp() {
        const loader = document.getElementById('loading-screen');
        loader.style.transition = 'opacity 0.5s';
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 500);
    }

    window.addEventListener('load', enterApp);

    // ── Tab switching ──
    function switchTab(tab) {
        if (window.currentSelectType && window.currentSelectType !== tab) cancelSelectMode();
        ['BUBBLE', 'NIN', 'NEG', 'DIARY'].forEach(t => {
            document.getElementById('tab' + t.charAt(0) + t.slice(1).toLowerCase()).classList.toggle('active', t === tab);
            document.getElementById(t.toLowerCase() + '-container').style.display = (t === tab) ? 'block' : 'none';
        });
        document.getElementById('diary-full-editor').style.display  = 'none';
        document.getElementById('diary-detail-view').style.display  = 'none';
    }

    // ── Search ──
    window.searchQuery = '';
    window.imgFilter = { BUBBLE: false, NIN: false, NEG: false };
    window.hashtagFilter = { BUBBLE: null, NIN: null, NEG: null };
    window.selectMode = { BUBBLE: false, NIN: false, NEG: false };
    window.selectedPosts = { BUBBLE: new Set(), NIN: new Set(), NEG: new Set() };
    window.currentSelectType = null;

    function toggleImgFilter(type) {
        window.imgFilter[type] = !window.imgFilter[type];
        document.getElementById(type.toLowerCase() + '-img-filter').classList.toggle('active', window.imgFilter[type]);
        renderBoard(type);
    }

    function onSearch() {
        window.searchQuery = document.getElementById('global-search').value.trim();
        document.getElementById('search-clear-btn').classList.toggle('visible', window.searchQuery.length > 0);
        ['BUBBLE', 'NIN', 'NEG', 'DIARY'].forEach(t => renderBoard(t));
    }

    function clearSearch() {
        window.searchQuery = '';
        document.getElementById('global-search').value = '';
        document.getElementById('search-clear-btn').classList.remove('visible');
        ['bubble', 'nin', 'neg'].forEach(t => {
            const countEl = document.getElementById(t + '-search-count');
            if (countEl) countEl.innerText = '';
        });
        const dc = document.getElementById('diary-search-count');
        if (dc) dc.innerText = '';

        ['BUBBLE', 'NIN', 'NEG', 'DIARY'].forEach(t => renderBoard(t));
    }

    function highlight(text, kw) {
        if (!kw) return text;
        const escaped = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return text.replace(new RegExp(escaped, 'gi'), m => `<mark class="hl">${m}</mark>`);
    }

    // ── Render ──
    function linkify(text, type) {
        let out = text.replace(/(https?:\/\/[^\s]+)/g,
            url => `<a href="${url}" target="_blank" style="color:#227be4; text-decoration:underline;">${url}</a>`);

        if (type) {
            // hashtag: # followed by Korean/English/number/underscore, no spaces
            out = out.replace(/(^|[\s>])(#[\p{L}\p{N}_]+)/gu, (m, pre, tag) =>
                `${pre}<span class="hashtag" onclick="filterByHashtag('${type}', '${tag.replace(/'/g, "\\'")}')">${tag}</span>`
            );
        }
        return out;
    }

    function renderBoard(type) {
        if (type === 'DIARY') return renderDiary();

        const kw          = window.searchQuery;
        const onlyImages  = window.imgFilter[type];
        const activeTag   = window.hashtagFilter[type];
        const container   = document.getElementById(type.toLowerCase() + '-list');
        const countEl      = document.getElementById(type.toLowerCase() + '-search-count');
        const tagBadgeEl  = document.getElementById(type.toLowerCase() + '-hashtag-badge');
        const pg          = document.getElementById(type.toLowerCase() + '-pagination');

        // Everything lives locally now, so search/filter/paging are all
        // just different views over the same in-memory array — no fetches.
        let posts = window.boardData[type] || [];

        if (onlyImages) {
            posts = posts.filter(p => (p.images || []).length > 0);
        }

        if (activeTag) {
            posts = posts.filter(p => (p.content || '').includes(activeTag));
        }

        if (kw) {
            const kwLower = kw.toLowerCase();
            posts = posts.filter(p => (p.content || '').toLowerCase().includes(kwLower));
        }

        const filtered = !!(kw || onlyImages || activeTag);

        if (filtered) {
            if (countEl) countEl.innerText = `${posts.length} RESULT${posts.length !== 1 ? 'S' : ''} FOUND`;
            if (pg) pg.style.display = 'none';
        } else {
            if (countEl) countEl.innerText = '';
        }

        if (tagBadgeEl) {
            tagBadgeEl.innerHTML = activeTag
                ? `<span class="hashtag-badge">${activeTag} <span class="hashtag-badge-clear" onclick="clearHashtagFilter('${type}')">✕</span></span>`
                : '';
        }

        renderTagCloud(type);

        if (posts.length === 0 && filtered) {
            container.innerHTML = `<div style="color:#0f380f; text-align:center; padding:20px; font-size:10px;">
                ${activeTag ? 'NO POSTS WITH THIS TAG.' : (onlyImages && !kw ? 'NO IMAGE POSTS.' : 'NO RESULTS.')}
            </div>`;
            return;
        }

        if (!filtered) {
            const total = Math.ceil(posts.length / window.POSTS_PER_PAGE) || 1;
            if (window.currentPage[type] > total) window.currentPage[type] = total;
            if (window.currentPage[type] < 1) window.currentPage[type] = 1;
            const start = (window.currentPage[type] - 1) * window.POSTS_PER_PAGE;
            posts = posts.slice(start, start + window.POSTS_PER_PAGE);
            if (pg) pg.style.display = 'flex';
            renderPagination(type, window.currentPage[type], total);
        }

        const selecting = window.selectMode[type];

        container.innerHTML = posts.map(p => {
            const isSelected = selecting && window.selectedPosts[type].has(p.id);
            return `
            <div class="post-item${isSelected ? ' selected' : ''}" data-id="${p.id}" data-type="${type}">
                <div class="post-actions">
                    ${selecting ? `<input type="checkbox" class="post-select-checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); togglePostSelect('${type}', '${p.id}', this)">` : ''}
                    <span onclick="startEditPost('${type}', '${p.id}')">EDIT</span>
                    <span onclick="movePostFromEl(this)">MOVE</span>
                    <span onclick="deletePostFromEl(this)">DEL</span>
                </div>
                <div style="font-family:sans-serif; font-size:14px; padding-right:10px;">${highlight(linkify(p.content, type), kw)} <span style="color:#306230; font-size:9px;">${p.date}</span></div>
                <div style="display:flex; gap:5px; margin-top:10px; flex-wrap:wrap;"
                     data-images='${(p.images||[]).map(u=>u.replace(/'/g,"&#39;")).join(",")}'>
                    ${(p.images || []).map(img =>
                        `<img src="${img}" onclick="openModalFromThumb(this)"
                              style="width:70px; height:70px; object-fit:cover; border:1px solid #0f380f; cursor:zoom-in; filter: grayscale(1) sepia(1) hue-rotate(30deg) brightness(0.7) contrast(1.2);">`
                    ).join('')}
                </div>
            </div>
        `;
        }).join('');
    }

    // ── Hashtag filter (scoped to a single board) ──
    function extractHashtags(text) {
        const matches = (text || '').match(/(^|[\s>])(#[\p{L}\p{N}_]+)/gu) || [];
        return matches.map(m => m.replace(/^[\s>]/, ''));
    }

    // 새로 추가할 텍스트 삽입 함수
function insertHashtag(type, tag) {
    const textarea = document.getElementById(type.toLowerCase() + '-text');
    if (!textarea) return;
    
    const val = textarea.value;
    const needsSpace = val.length > 0 && !val.endsWith(' ') && !val.endsWith('\n');
    
    textarea.value = val + (needsSpace ? ' ' : '') + tag + ' ';
    textarea.focus();
}

// 기존 함수를 대체할 새로운 renderTagCloud 함수
function renderTagCloud(type) {
    const el = document.getElementById(type.toLowerCase() + '-tag-cloud');
    const insertEl = document.getElementById(type.toLowerCase() + '-insert-tags');

    if (!el && !insertEl) return;

    const posts = window.boardData[type] || [];
    const counts = {};
    posts.forEach(p => {
        extractHashtags(p.content).forEach(tag => {
            counts[tag] = (counts[tag] || 0) + 1;
        });
    });

    const tags = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
    const activeTag = window.hashtagFilter[type];

    // 1. 하단의 검색/필터용 태그 클라우드 (기존 기능 유지)
    if (el) {
        if (tags.length === 0) { el.innerHTML = ''; }
        else {
            el.innerHTML = tags.map(tag => `
                <span class="tag-cloud-item ${tag === activeTag ? 'active' : ''}"
                      onclick="${tag === activeTag ? `clearHashtagFilter('${type}')` : `filterByHashtag('${type}', '${tag.replace(/'/g, "\\'")}')`}">
                    ${tag} <span style="opacity:0.6;">${counts[tag]}</span>
                </span>
            `).join('');
        }
    }

    // 2. 글쓰기 에디터 하단의 태그 삽입용 버튼 목록 (새로 추가된 기능)
    if (insertEl) {
        if (tags.length === 0) { insertEl.innerHTML = ''; }
        else {
            insertEl.innerHTML = tags.map(tag => `
                <span class="tag-cloud-item" onclick="insertHashtag('${type}', '${tag.replace(/'/g, "\\'")}')">
                    + ${tag}
                </span>
            `).join('');
        }
    }
}

    // ── Image handling ──
    function toWebP(file, quality = 0.85) {
        return new Promise(resolve => {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width  = img.naturalWidth;
                canvas.height = img.naturalHeight;
                canvas.getContext('2d').drawImage(img, 0, 0);
                URL.revokeObjectURL(url);
                canvas.toBlob(blob => resolve(blob), 'image/webp', quality);
            };
            img.src = url;
        });
    }

    async function processImageFile(file, previewContainerId) {
        if (!file.type.startsWith('image/')) return;
        const blob    = await toWebP(file);
        const preview = URL.createObjectURL(blob);  // no base64, no size limit
        tempBlobs.push(blob);
        tempImages.push(preview);
        updatePreview(previewContainerId);
    }

    function handleImg(input, type) {
        const previewId = type.toLowerCase() + '-previews';
        Array.from(input.files).forEach(file => processImageFile(file, previewId));
        input.value = ''; // reset so same file can be re-added
    }

    function setupDragDrop(editorBoxId, previewContainerId) {
        const box = document.getElementById(editorBoxId);
        if (!box) return;

        box.addEventListener('dragover', e => {
            e.preventDefault();
            box.classList.add('drag-over');
        });
        box.addEventListener('dragleave', e => {
            if (!box.contains(e.relatedTarget)) box.classList.remove('drag-over');
        });
        box.addEventListener('drop', e => {
            e.preventDefault();
            box.classList.remove('drag-over');
            Array.from(e.dataTransfer.files).forEach(file => processImageFile(file, previewContainerId));
        });
    }

    setupDragDrop('bubble-editor-box', 'bubble-previews');
    setupDragDrop('nin-editor-box',    'nin-previews');
    setupDragDrop('neg-editor-box',    'neg-previews');
    setupDragDrop('diary-editor-box',  'diary-previews');

    // ── Save post ──
    async function savePost(type) {
        const btnId = type.toLowerCase() + 'SendBtn';
        const btn   = document.getElementById(btnId);
        btn.innerText = "SAVING...";
        btn.disabled  = true;

        const now  = new Date();
        const date = `[${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}]`;
        const { ref, uploadBytes, getDownloadURL } = window.fbActions;

        try {
            // Images still upload right away (needed to preview/display them);
            // it's the Firestore document write that's now deferred.
            const imageUrls = [];
            for (let i = 0; i < tempBlobs.length; i++) {
                const storageRef = ref(window.storage, `images/${Date.now()}_${i}.webp`);
                await uploadBytes(storageRef, tempBlobs[i], { contentType: 'image/webp' });
                imageUrls.push(await getDownloadURL(storageRef));
            }

            if (type === 'BUBBLE' || type === 'NIN' || type === 'NEG') {
                const inputEl = document.getElementById(type.toLowerCase() + '-text');
                const content = inputEl.value;

                if (editPostId) {
                    const merged = [...tempImages.filter(img => img.startsWith('http')), ...imageUrls];
                    window.queueUpdate(type, editPostId, { content, images: merged });
                    editPostId = null;
                } else {
                    window.queueCreate(type, { content, images: imageUrls, date, createdAt: Date.now() });
                    window.currentPage[type] = 1;
                }
                inputEl.value = '';
                window.renderBoard(type);
            } else {
                const title   = document.getElementById('diaryTitleInput').value || "NO TITLE";
                const content = document.getElementById('diaryContentInput').value;

                if (editDiaryId) {
                    const merged = [...tempImages.filter(img => img.startsWith('http')), ...imageUrls];
                    window.queueUpdate('DIARY', editDiaryId, { title, content, images: merged });
                    editDiaryId = null;
                } else {
                    window.queueCreate('DIARY', { title, content, images: imageUrls, date, createdAt: Date.now() });
                }
                closeDiaryEditor();
                window.renderBoard('DIARY');
            }

            tempImages.forEach(url => { if (url.startsWith('blob:')) URL.revokeObjectURL(url); });
            tempImages = [];
            tempBlobs  = [];
            updatePreview(type.toLowerCase() + '-previews');
        } catch (e) {
            console.error(e);
            alert("이미지 업로드 실패!");
        }

        btn.innerText = "SEND";
        btn.disabled  = false;
    }

    function openMoveTargetPopup(anchorEl, targets, onPick) {
        const existing = document.getElementById('movePopup');
        if (existing) existing.remove();

        const popup = document.createElement('div');
        popup.id = 'movePopup';
        popup.className = 'move-popup';

        targets.forEach(t => {
            const opt = document.createElement('span');
            opt.className = 'move-popup-option';
            opt.innerText = t;
            opt.onclick = (e) => {
                e.stopPropagation();
                popup.remove();
                onPick(t);
            };
            popup.appendChild(opt);
        });

        document.body.appendChild(popup);

        const rect = anchorEl.getBoundingClientRect();
        popup.style.top  = (window.scrollY + rect.bottom + 4) + 'px';
        popup.style.left = Math.max(8, window.scrollX + rect.right - popup.offsetWidth) + 'px';

        setTimeout(() => {
            document.addEventListener('click', function closeOnce(e) {
                if (!popup.contains(e.target)) {
                    popup.remove();
                    document.removeEventListener('click', closeOnce);
                }
            });
        }, 0);
    }

    function openBulkMovePopup(el) {
        const type = window.currentSelectType;
        if (!type) return;

        const ids = Array.from(window.selectedPosts[type]);
        if (ids.length === 0) { alert('이동할 글을 먼저 선택해주세요.'); return; }

        const targets = ALL_BOARDS.filter(t => t !== type);
        openMoveTargetPopup(el, targets, (toType) => {

        });

    function bulkMovePosts(fromType, toType, ids) {
        const cache = window.boardData[fromType] || [];
        let moved = 0, skipped = 0;

        for (const id of ids) {
            const post = cache.find(p => p.id === id);
            if (!post) { skipped++; continue; }
            window.queueCreate(toType, {
                content:   post.content,
                images:    post.images || [],
                date:      post.date,
                createdAt: post.createdAt || Date.now()
            });
            window.queueDelete(fromType, id, []); // images move with the copy, don't delete from storage
            moved++;
        }

        cancelSelectMode();
        window.renderBoard(fromType);
        window.renderBoard(toType);

        if (skipped > 0) alert(`${moved}개 이동 완료, ${skipped}개는 찾지 못했어요.`);
    }

    function movePost(fromType, toType, id, images) {
        const post = (window.boardData[fromType] || []).find(p => p.id === id);
        if (!post) return;

        window.queueCreate(toType, {
            content:   post.content,
            images:    post.images || [],
            date:      post.date,
            createdAt: post.createdAt || Date.now()
        });
        window.queueDelete(fromType, id, []); // images move with the copy, don't delete from storage

        window.renderBoard(fromType);
        window.renderBoard(toType);
    }

    function openModalFromThumb(imgEl) {

    // ── Modal ──
    let modalImages = [];
    let modalIndex  = 0;
    let zoomLevel   = 1;
    const ZOOM_MIN  = 1;
    const ZOOM_MAX  = 40;   // 4000% — enough to view ~30,000px-tall images near native resolution
    const ZOOM_STEP = 1;    // 100% per step

    function showModal(src, images) {
        modalImages = images || [src];
        modalIndex  = modalImages.indexOf(src);
        if (modalIndex < 0) modalIndex = 0;
        zoomLevel = 1;
        renderModal();
        document.getElementById('imgModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('imgModal').style.display = 'none';
    }

    function renderModal() {
        document.getElementById('modalImg').src = modalImages[modalIndex];
        const total = modalImages.length;
        document.getElementById('modalCounter').innerText = total > 1 ? `${modalIndex + 1} / ${total}` : '';
        document.getElementById('modalPrev').classList.toggle('hidden', total <= 1);
        document.getElementById('modalNext').classList.toggle('hidden', total <= 1);
        applyZoom();
    }

    function modalNav(dir) {
        modalIndex = (modalIndex + dir + modalImages.length) % modalImages.length;
        zoomLevel = 1; // reset zoom when switching images
        renderModal();
    }

    // ── Zoom ──
    function applyZoom() {
        const img  = document.getElementById('modalImg');
        const wrap = document.getElementById('modalImgWrap');

        if (zoomLevel <= 1) {
            zoomLevel = 1;
            img.style.width  = '';
            img.style.height = '';
            wrap.classList.remove('zoomed');
            wrap.scrollTop  = 0;
            wrap.scrollLeft = 0;
        } else {
            img.style.width  = (zoomLevel * 100) + '%';
            img.style.height = (zoomLevel * 100) + '%';
            wrap.classList.add('zoomed');
        }
        document.getElementById('modalZoomLabel').innerText = Math.round(zoomLevel * 100) + '%';
    }

    function zoomIn()    { zoomLevel = Math.min(ZOOM_MAX, zoomLevel + ZOOM_STEP); applyZoom(); }
    function zoomOut()   { zoomLevel = Math.max(ZOOM_MIN, zoomLevel - ZOOM_STEP); applyZoom(); }
    function zoomReset() { zoomLevel = 1; applyZoom(); }

    // click backdrop to close
    document.getElementById('imgModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    // click empty space around the image (inside the wrap) to close too —
    // skip while zoomed, since that area is used for panning/scrolling
    document.getElementById('modalImgWrap').addEventListener('click', function(e) {
        if (e.target === this && zoomLevel <= 1) closeModal();
    });

    // keyboard navigation + zoom shortcuts
    document.addEventListener('keydown', e => {
        if (document.getElementById('imgModal').style.display !== 'flex') return;

        // Ctrl/Cmd + (+/-/0) → zoom in/out/reset
        if (e.ctrlKey || e.metaKey) {
            if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomIn(); return; }
            if (e.key === '-' || e.key === '_') { e.preventDefault(); zoomOut(); return; }
            if (e.key === '0') { e.preventDefault(); zoomReset(); return; }
        }

        if (e.key === 'ArrowLeft'  && zoomLevel === 1) modalNav(-1);
        if (e.key === 'ArrowRight' && zoomLevel === 1) modalNav(1);
        if (e.key === 'Escape') closeModal();
    });

    // ctrl + wheel to zoom
    document.getElementById('imgModal').addEventListener('wheel', e => {
        if (!(e.ctrlKey || e.metaKey)) return;
        e.preventDefault();
        if (e.deltaY < 0) zoomIn(); else zoomOut();
    }, { passive: false });

    // swipe support (only when not zoomed, to avoid conflicting with panning)
    let touchStartX = 0;
    document.getElementById('imgModal').addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
    document.getElementById('imgModal').addEventListener('touchend',   e => {
        if (zoomLevel > 1) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) modalNav(dx < 0 ? 1 : -1);
    });

    // ── Backup ──
    async function backupToMarkdown() {
        const btn = document.querySelector('.backup-text');
        const originalLabel = btn ? btn.textContent : '';
        if (btn) { btn.textContent = '⏳ EXPORTING...'; btn.style.pointerEvents = 'none'; }

        try {
            // Builds the backup entirely from the local in-memory data —
            // no Firestore reads needed, since window.boardData already holds
            // everything (including changes made this session, even before sync).
            const zip       = new JSZip();
            const imgFolder = zip.folder("images");
            let md = "# NALLEUM BACKUP\n\n";

            async function appendBoard(type, title) {
                const posts = window.boardData[type] || [];

                md += `## ${title}\n\n`;

                for (const data of posts) {
                    md += `### ${data.date}\n<!-- nalleum:${type}:${data.id} -->\n${data.content}\n`;

                    if (data.images) {
                        for (let i = 0; i < data.images.length; i++) {
                            const fileName = `img_${type.toLowerCase()}_${data.id}_${i}.png`;
                            try {
                                const res = await fetch(data.images[i]);
                                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                                const blob = await res.blob();
                                imgFolder.file(fileName, blob);
                                md += `![img](images/${fileName})\n`;
                            } catch (imgErr) {
                                // 이미지 하나가 실패해도(CORS, 네트워크 등) 전체 내보내기는 계속 진행
                                console.error(`[nalleum] 이미지 다운로드 실패: ${data.images[i]}`, imgErr);
                                md += `![img](${data.images[i]}) <!-- 다운로드 실패: 원본 링크로 대체됨 -->\n`;
                            }
                        }
                    }

                    md += "\n---\n\n";
                }
            }

            await appendBoard("BUBBLE", "BUBBLE");
            await appendBoard("NIN", "NIN");
            await appendBoard("NEG", "NEG");
            await appendBoard("DIARY", "DIARY");

            zip.file("backup.md", md);
            const content = await zip.generateAsync({ type: "blob" });
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href     = url;
            a.download = `nalleum_backup_${new Date().toISOString().split('T')[0]}.zip`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (err) {
            console.error('[nalleum] 백업 내보내기 실패:', err);
            alert('마크다운 내보내기에 실패했습니다.\n' + (err && err.message ? err.message : err));
        } finally {
            if (btn) { btn.textContent = originalLabel || '🔄 REPORT'; btn.style.pointerEvents = ''; }
        }
    }

    // ── Ctrl+Enter to send ──
    ['bubble-text', 'nin-text', 'neg-text', 'diaryContentInput'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                if (id === 'bubble-text')        savePost('BUBBLE');
                else if (id === 'nin-text')      savePost('NIN');
                else if (id === 'neg-text')      savePost('NEG');
                else if (id === 'diaryContentInput') savePost('DIARY');
            }
        });
    });
</script>
</body>
</html>
